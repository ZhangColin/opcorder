          type: array
          items:
            type: string
        opcLevel:
          type: string
          enum: [C, B, A, any]
        budget:
          type: number
        deadline:
          type: string
          format: date
        milestones:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              deadline:
                type: string
                format: date
              deliverableDesc:
                type: string
            required:
              - name
              - deadline
        mode:
          type: string
          enum: [open, directed]
        bidDeadline:
          type: string
          format: date-time
        isUrgent:
          type: boolean
          default: false
        directedOpcIds:
          type: array
          items:
            type: integer
        attachments:
          type: array
          description: Uploaded file attachments
          items:
            type: object
            properties:
              name:
                type: string
              size:
                type: string
              type:
                type: string
              url:
                type: string
      required:
        - title
        - type
        - description
        - skillTags
        - opcLevel
        - budget
        - deadline
        - mode

    UpdateDemandInput:
      type: object
      properties:
