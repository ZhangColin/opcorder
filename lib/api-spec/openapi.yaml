          type: integer
        publisherName:
          type: string
        bidCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - demandNo
        - title
        - type
        - description
        - skillTags
        - opcLevel
        - budget
        - deadline
        - mode
        - status
        - publisherId
        - createdAt

