        id:
          type: integer
        demandId:
          type: integer
        demandTitle:
          type: string
          nullable: true
        publisherName:
          type: string
          nullable: true
        amount:
          type: number
        method:
          type: string
          enum: [online, offline]
        status:
          type: string
          enum: [pending, confirmed, rejected, refunded, refund_pending, refunding]
        paymentOrderNo:
          type: string
          nullable: true
          description: Payment provider order number (online payments only)
        qrCodeUrl:
          type: string
          nullable: true
          description: QR code URL returned at payment creation (online only, not persisted)
        receiptUrl:
          type: string
          nullable: true
        paymentNote:
          type: string
          nullable: true
        rejectReason:
          type: string
          nullable: true
        confirmedBy:
          type: integer
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        refundOrderNo:
          type: string
          nullable: true
        refundedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - demandId
        - amount
        - method
        - status
        - createdAt

