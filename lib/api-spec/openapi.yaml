          type: string
          maxLength: 50
        description:
          type: string
        skillTags:
          type: array
          items:
            type: string
        opcLevel:
          type: string
          enum: [C, B, A, any]
        budget:
          type: number
        deadline:
          type: string
          format: date
        milestones:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              deadline:
                type: string
                format: date
              deliverableDesc:
                type: string
            required:
              - name
              - deadline
        bidDeadline:
          type: string
          format: date-time
        isUrgent:
          type: boolean

    DemandPayment:
      type: object
