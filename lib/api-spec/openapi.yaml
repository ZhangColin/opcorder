openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: JieDanBa OPC Matching Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: demands
    description: Demand management
  - name: bids
    description: Bid/application management
  - name: orders
    description: Order management
  - name: users
    description: User management
  - name: notifications
    description: Notification management
  - name: portfolios
    description: Portfolio management
  - name: stats
    description: Platform statistics
  - name: activities
    description: Activity registration management
  - name: agent
    description: AI demand analysis agent

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stats/overview:
    get:
      operationId: getOverviewStats
      tags: [stats]
      summary: Get platform overview statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewStats"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/opc-leaderboard:
    get:
      operationId: getOpcLeaderboard
      tags: [users]
      summary: Get OPC leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpcProfile"

  /users/{userId}:
    get:
      operationId: getUserById
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/opc-profile:
    get:
      operationId: getOpcProfile
      tags: [users]
      summary: Get OPC profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OPC profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpcProfile"
    put:
      operationId: updateOpcProfile
      tags: [users]
      summary: Update OPC profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOpcProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpcProfile"

  /demands:
    get:
      operationId: listDemands
      tags: [demands]
      summary: List demands with filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_review, pending_payment, published, matched, in_progress, pending_acceptance, completed, closed, refund_pending, refunding, refunded]
        - name: type
          in: query
          schema:
            type: string
        - name: opcLevel
          in: query
          schema:
            type: string
            enum: [C, B, A, any]
        - name: minBudget
          in: query
          schema:
            type: number
        - name: maxBudget
          in: query
          schema:
            type: number
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, deadline, budget_high, budget_low]
            default: newest
        - name: deadlineFilter
          in: query
          schema:
            type: string
            enum: ["24h", "week", "month"]
        - name: eligibleLevel
          in: query
          description: Show demands where requiredLevel matches this level OR is "any"
          schema:
            type: string
            enum: [C, B, A]
        - name: publisherId
          in: query
          description: Filter demands by publisher user ID
          schema:
            type: integer
      responses:
        "200":
          description: Demands list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandListResponse"
    post:
      operationId: createDemand
      tags: [demands]
      summary: Create a new demand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemandInput"
      responses:
        "201":
          description: Created demand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"

  /demands/{demandId}:
    get:
      operationId: getDemandById
      tags: [demands]
      summary: Get demand detail
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Demand detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"
    put:
      operationId: updateDemand
      tags: [demands]
      summary: Update a demand
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDemandInput"
      responses:
        "200":
          description: Updated demand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"

  /demands/{demandId}/status:
    patch:
      operationId: updateDemandStatus
      tags: [demands]
      summary: Update demand status
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [draft, pending_review, pending_payment, published, matched, in_progress, pending_acceptance, completed, closed, refund_pending, refunding, refunded]
                reason:
                  type: string
              required:
                - status
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"

  /demands/{demandId}/bids:
    get:
      operationId: listBidsForDemand
      tags: [bids]
      summary: List bids for a demand
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bids list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BidApplication"
    post:
      operationId: createBid
      tags: [bids]
      summary: Submit a bid application
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBidInput"
      responses:
        "201":
          description: Bid created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidApplication"

  /bids/my:
    get:
      operationId: getMyBids
      tags: [bids]
      summary: List all bids submitted by the current OPC user
      responses:
        "200":
          description: List of my bid applications with demand info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyBidItem"

  /bids/{bidId}/withdraw:
    patch:
      operationId: withdrawBid
      tags: [bids]
      summary: Withdraw a pending bid application
      parameters:
        - name: bidId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Withdrawn bid
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    enum: [withdrawn]
                required:
                  - id
                  - status

  /bids/{bidId}/status:
    patch:
      operationId: updateBidStatus
      tags: [bids]
      summary: Accept or reject a bid
      parameters:
        - name: bidId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
              required:
                - status
      responses:
        "200":
          description: Updated bid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidApplication"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [in_progress, pending_acceptance, completed, closed, disputed]
        - name: role
          in: query
          schema:
            type: string
            enum: [opc, publisher]
        - name: opcId
          in: query
          description: Filter orders by OPC user ID (admin use)
          schema:
            type: integer
        - name: publisherId
          in: query
          description: Filter orders by publisher user ID (admin use)
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"

  /orders/{orderId}:
    get:
      operationId: getOrderById
      tags: [orders]
      summary: Get order detail
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{orderId}/deliverables:
    post:
      operationId: submitDeliverable
      tags: [orders]
      summary: Submit a deliverable
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliverableInput"
      responses:
        "201":
          description: Deliverable submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deliverable"

  /orders/{orderId}/accept:
    post:
      operationId: acceptOrder
      tags: [orders]
      summary: Accept order delivery
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        "200":
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{orderId}/reject:
    post:
      operationId: rejectDelivery
      tags: [orders]
      summary: Reject delivery with feedback
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
                - reason
      responses:
        "200":
          description: Delivery rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /portfolios:
    get:
      operationId: listPortfolios
      tags: [portfolios]
      summary: List portfolio items
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Portfolio items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Portfolio"
    post:
      operationId: createPortfolio
      tags: [portfolios]
      summary: Add a portfolio item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioInput"
      responses:
        "201":
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /portfolios/{portfolioId}:
    put:
      operationId: updatePortfolio
      tags: [portfolios]
      summary: Update a portfolio item
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioInput"
      responses:
        "200":
          description: Updated portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
    delete:
      operationId: deletePortfolio
      tags: [portfolios]
      summary: Delete a portfolio item
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required:
                  - count

  /posts:
    get:
      operationId: listPosts
      tags: [community]
      summary: List community posts
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, hot]
            default: latest
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
    post:
      operationId: createPost
      tags: [community]
      summary: Create a new community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{postId}/like:
    post:
      operationId: togglePostLike
      tags: [community]
      summary: Toggle like on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
              required: [userId]
      responses:
        "200":
          description: Toggle result
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
                  likesCount:
                    type: integer
                required: [liked, likesCount]

  /posts/{postId}/comments:
    get:
      operationId: listPostComments
      tags: [community]
      summary: Get comments for a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostComment"
    post:
      operationId: createPostComment
      tags: [community]
      summary: Add a comment to a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorId:
                  type: integer
                content:
                  type: string
              required: [authorId, content]
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostComment"

  /courses:
    get:
      operationId: listCourses
      tags: [academy]
      summary: List available courses
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [tech, strategy, compliance, operations]
        - name: requiredLevel
          in: query
          schema:
            type: string
            enum: [C, B, A]
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"

  /courses/{courseId}/enroll:
    post:
      operationId: enrollCourse
      tags: [academy]
      summary: Enroll in a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
              required: [userId]
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "200":
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /courses/my-enrollments:
    get:
      operationId: listMyEnrollments
      tags: [academy]
      summary: Get current user course enrollments
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of enrollments with course info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentWithCourse"

  /demands/{demandId}/payment:
    get:
      operationId: getDemandPayment
      tags: [demands]
      summary: Get the pending deposit payment for a demand (publisher or admin only)
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment record, or null if none submitted yet
          content:
            application/json:
              schema:
                nullable: true
                oneOf:
                  - $ref: "#/components/schemas/DemandPayment"
        "404":
          description: Demand not found
    post:
      operationId: submitDemandPayment
      tags: [demands]
      summary: Submit deposit payment for a demand
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemandPaymentInput"
      responses:
        "201":
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandPayment"

  /demands/{demandId}/payment-status:
    post:
      operationId: pollDemandPaymentStatus
      tags: [demands]
      summary: Poll online payment status for a demand deposit (publisher only)
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current payment status from payment provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandPaymentStatusResponse"
        "404":
          description: No online payment order found

  /admin/demand-payments:
    get:
      operationId: listDemandPayments
      tags: [admin]
      summary: List pending deposit payments
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, confirmed, rejected]
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminDemandPaymentRow"

  /admin/demand-payments/{paymentId}:
    patch:
      operationId: reviewDemandPayment
      tags: [admin]
      summary: Confirm or reject a deposit payment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [confirm, reject]
                rejectReason:
                  type: string
              required:
                - action
      responses:
        "200":
          description: Payment reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandPayment"

  /admin/demand-payments/{paymentId}/refund:
    post:
      operationId: refundDemandPayment
      tags: [admin]
      summary: Refund a confirmed demand deposit payment (online payments only)
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for refund
      responses:
        "200":
          description: Refund initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  refundOrderNo:
                    type: string
                  refundedAt:
                    type: string
                    format: date-time
        "400":
          description: No paymentOrderNo on record (offline payment, cannot auto-refund)
        "409":
          description: Payment not in confirmed state or already refunded

  /activities/{activityId}/public:
    get:
      operationId: getActivityPublic
      tags: [activities]
      summary: Get activity info (public, no auth)
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity with custom fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityWithFields"
        "404":
          description: Activity not found or closed

  /activities/{activityId}/register:
    post:
      operationId: submitRegistration
      tags: [activities]
      summary: Submit a registration (public, no auth)
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRegistrationInput"
      responses:
        "201":
          description: Registration submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  ok:
                    type: boolean
                required: [id, ok]
        "400":
          description: Validation error
        "404":
          description: Activity not found or closed

  /admin/activities:
    get:
      operationId: adminListActivities
      tags: [activities]
      summary: List activities (admin)
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated activity list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActivityListResponse"
    post:
      operationId: adminCreateActivity
      tags: [activities]
      summary: Create activity (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityWithFields"

  /admin/activities/{activityId}:
    get:
      operationId: adminGetActivity
      tags: [activities]
      summary: Get activity with fields (admin)
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity with fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityWithFields"
        "404":
          description: Not found
    put:
      operationId: adminUpdateActivity
      tags: [activities]
      summary: Update activity (admin)
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityWithFields"
    delete:
      operationId: adminDeleteActivity
      tags: [activities]
      summary: Delete activity (admin)
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /admin/activities/{activityId}/toggle:
    patch:
      operationId: adminToggleActivity
      tags: [activities]
      summary: Toggle activity active/inactive (admin)
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  isActive:
                    type: boolean
                required: [isActive]

  /admin/activities/{activityId}/registrations:
    get:
      operationId: adminListRegistrations
      tags: [activities]
      summary: List registrations for an activity (admin)
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated registration list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationListResponse"

  /admin/activities/{activityId}/tags:
    get:
      operationId: adminGetActivityTags
      tags: [activities]
      summary: Get all tags used in activity registrations (admin)
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: string
                required: [tags]

  /admin/registrations/{registrationId}:
    get:
      operationId: adminGetRegistration
      tags: [activities]
      summary: Get registration detail (admin)
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationDetail"
        "404":
          description: Not found

  /admin/registrations/{registrationId}/note:
    patch:
      operationId: adminUpdateRegistrationNote
      tags: [activities]
      summary: Update admin note on registration (admin)
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        "200":
          description: Updated

  /admin/registrations/{registrationId}/tags:
    post:
      operationId: adminAddRegistrationTag
      tags: [activities]
      summary: Add tag to registration (admin)
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: string
              required: [tag]
      responses:
        "200":
          description: Updated tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: string
                required: [tags]

  /admin/registrations/{registrationId}/tags/{tag}:
    delete:
      operationId: adminDeleteRegistrationTag
      tags: [activities]
      summary: Delete tag from registration (admin)
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: integer
        - name: tag
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: string
                required: [tags]

  /agent/demand-analysis/status:
    get:
      operationId: getAgentDemandAnalysisStatus
      tags: [agent]
      summary: Get demand analysis agent enabled status
      responses:
        "200":
          description: Agent status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isEnabled:
                    type: boolean
                required: [isEnabled]
        "401":
          description: Unauthorized

  /agent/demand-analysis/chat:
    post:
      operationId: agentDemandAnalysisChat
      tags: [agent]
      summary: Send a message to the demand analysis agent (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatInput"
      responses:
        "200":
          description: SSE stream of tokens and events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "503":
          description: Agent not configured or disabled

  /agent/demand-analysis/history/{demandId}:
    get:
      operationId: getAgentDemandHistory
      tags: [agent]
      summary: Get conversation history for a demand or session
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: string
          description: Demand ID (integer) or "session" for session-based lookup
        - name: sessionKey
          in: query
          schema:
            type: string
          description: Session key for pre-draft conversations (used when demandId is "session")
      responses:
        "200":
          description: Conversation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHistoryResponse"
        "401":
          description: Unauthorized

  /agent/demand-analysis/bind-demand:
    post:
      operationId: bindAgentConversationToDemand
      tags: [agent]
      summary: Bind a temporary session conversation to a saved demand ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: integer
                demandId:
                  type: integer
              required: [conversationId, demandId]
      responses:
        "200":
          description: Bound successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "401":
          description: Unauthorized
        "404":
          description: Conversation not found

  /admin/agent-configs:
    get:
      operationId: listAgentConfigs
      tags: [agent]
      summary: List all agent configurations (admin only)
      responses:
        "200":
          description: Agent configs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentConfig"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/agent-configs/{id}:
    get:
      operationId: getAgentConfigById
      tags: [agent]
      summary: Get agent configuration by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent config detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    put:
      operationId: updateAgentConfig
      tags: [agent]
      summary: Update agent configuration (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentConfigInput"
      responses:
        "200":
          description: Updated agent config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "400":
          description: No updatable fields
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OverviewStats:
      type: object
      properties:
        totalPayout:
          type: number
        payoutGrowth:
          type: number
        activeOpcs:
          type: integer
        monthlyOrders:
          type: integer
        completionRate:
          type: number
      required:
        - totalPayout
        - payoutGrowth
        - activeOpcs
        - monthlyOrders
        - completionRate

    User:
      type: object
      properties:
        id:
          type: integer
        nickname:
          type: string
        phone:
          type: string
        avatar:
          type: string
        role:
          type: string
          enum: [opc, publisher, admin]
        status:
          type: string
          enum: [active, suspended, banned]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nickname
        - role
        - status
        - createdAt

    OpcProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        nickname:
          type: string
        avatar:
          type: string
        level:
          type: string
          enum: [C, B, A]
        bio:
          type: string
        skillTags:
          type: array
          items:
            type: string
        industryTags:
          type: array
          items:
            type: string
        creditScore:
          type: number
        totalOrders:
          type: integer
        completionRate:
          type: number
        avgRating:
          type: number
        totalEarnings:
          type: number
        activityScore:
          type: number
      required:
        - id
        - userId
        - nickname
        - level
        - creditScore

    UpdateOpcProfileInput:
      type: object
      properties:
        nickname:
          type: string
        avatar:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        bio:
          type: string
        title:
          type: string
        location:
          type: string
        website:
          type: string
          nullable: true
        yearsExp:
          type: number
        wechat:
          type: string
        skillTags:
          type: array
          items:
            type: string
        industryTags:
          type: array
          items:
            type: string

    Milestone:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        deadline:
          type: string
          format: date
        deliverableDesc:
          type: string
        status:
          type: string
          enum: [pending, submitted, approved, rejected]
      required:
        - name
        - deadline

    Demand:
      type: object
      properties:
        id:
          type: integer
        demandNo:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [ai_education, gov_training, ai_research, party_building, livestream_media, ai_tool_dev, other]
        typeLabel:
          type: string
        description:
          type: string
        skillTags:
          type: array
          items:
            type: string
        opcLevel:
          type: string
          enum: [C, B, A, any]
        budget:
          type: number
        deadline:
          type: string
          format: date
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        mode:
          type: string
          enum: [open, directed]
        status:
          type: string
          enum: [draft, pending_review, pending_payment, published, matched, in_progress, pending_acceptance, completed, closed, refund_pending, refunding, refunded]
        isUrgent:
          type: boolean
        bidDeadline:
          type: string
          format: date-time
        attachments:
          type: array
          description: Uploaded file attachments for this demand
          items:
            type: object
            properties:
              name:
                type: string
              size:
                type: string
              type:
                type: string
              url:
                type: string
