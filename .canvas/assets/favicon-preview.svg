<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background — brand deep blue -->
  <rect width="180" height="180" rx="38" fill="#00327d"/>

  <!-- Subtle inner highlight for depth -->
  <rect x="1" y="1" width="178" height="88" rx="37" fill="url(#topGlow)" opacity="0.18"/>

  <!-- Shield body — white -->
  <path d="M90 26 L46 46 L46 95 C46 126 65 148 90 157 C115 148 134 126 134 95 L134 46 Z" fill="white"/>

  <!-- Shield inner shadow for depth -->
  <path d="M90 34 L52 52 L52 96 C52 124 69 144 90 152 C111 144 128 124 128 96 L128 52 Z" fill="url(#shieldGrad)"/>

  <!-- Check mark — secondary green -->
  <path d="M67 95 L82 110 L113 73"
        stroke="#006b5a"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <defs>
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="90" y1="34" x2="90" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e8eef8" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
